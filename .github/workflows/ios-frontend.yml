name: iOS frontend

on:
  push:
    branches:
      - frontend/ios-demo-*

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx expo prebuild --platform ios
      - name: Build unsigned Release for the iOS simulator
        run: |
          xcodebuild \
            -workspace ios/Perspective.xcworkspace \
            -scheme Perspective \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
