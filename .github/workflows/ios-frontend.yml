name: iOS frontend

on:
  push:
    branches:
      - frontend/ios-demo-*

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx expo prebuild --platform ios
      - name: Build unsigned Release for the iOS simulator
        run: |
          xcodebuild \
            -workspace ios/Perspective.xcworkspace \
            -scheme Perspective \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/perspective-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Launch and relaunch the Release app
        run: |
          app="$RUNNER_TEMP/perspective-build/Build/Products/Release-iphonesimulator/Perspective.app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Info.plist" |
            grep -F 'Perspective connects to your laptop'
          device="$(xcrun simctl list devices available --json | jq -er '
            [.devices | to_entries[]
              | select(.key | contains(".iOS-"))
              | .value[] | select(.name == "iPhone 17" and .isAvailable)]
            | last | .udid')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState unplugged --batteryLevel 100
          xcrun simctl install "$device" "$app"

          xcrun simctl launch "$device" "$bundle_id"
          data="$(xcrun simctl get_app_container "$device" "$bundle_id" data)"
          database="$data/Documents/SQLite/perspective.sqlite"
          for attempt in {1..20}; do
            if [ -f "$database" ] && [ "$(sqlite3 "$database" 'PRAGMA user_version;' 2>/dev/null)" = '1' ]; then
              break
            fi
            sleep 1
          done
          test "$(sqlite3 "$database" 'PRAGMA user_version;')" = '1'
          xcrun simctl terminate "$device" "$bundle_id"

          xcrun simctl launch "$device" "$bundle_id"
          sleep 3
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/perspective-practice.png"
          xcrun simctl terminate "$device" "$bundle_id"
      - name: Upload the simulator screenshot
        uses: actions/upload-artifact@v7
        with:
          name: perspective-practice-simulator
          path: ${{ runner.temp }}/perspective-practice.png
          if-no-files-found: error
